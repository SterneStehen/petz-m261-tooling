# M261 simulator configuration.
#
# AGENT-TASK §7 lists parameters the manufacturer has not confirmed as of
# writing: each one is declared here with an allowed set of values, a
# default, and an explicit `unconfirmed: true` marker — never hardcoded
# into the Go source — so that once Stage 0 on-site testing confirms the
# real value, only this file changes, not the code.
#
modbus:
  byte_order:
    value: big
    allowed: [big, little, big_word_swap, little_word_swap]
    unconfirmed: true

scaling:
  source:
    value: override
    allowed: [iec104, modbus, override]
    unconfirmed: true

# Task 6 item 5: EMS's actual behavior on a stale Remote-mode setpoint
# (Set Active Power/Set Reactive Power not refreshed) isn't confirmed.
watchdog:
  mode:
    value: zero_after
    allowed: [hold, zero_after, safe_state_after]
    unconfirmed: true
  timeout_s:
    value: 60
    unconfirmed: true

# Task 6 item 6: which mode wins when Remote, Demand Control, and Load
# Tracking are simultaneously enabled isn't described by the register map.
# A permutation of exactly these three names, highest priority first.
modes:
  priority:
    value: [remote, demand_control, load_tracking]
    unconfirmed: true

# Task 6 item 7: Trip (and Clear Protection, its release) are the two
# points the catalog flags dangerous: true (Task 1 item 8). Both are
# rejected unless this is explicitly set true.
commands:
  allow_dangerous:
    value: false
    unconfirmed: true

setpoints:
  apply:
    value: immediate
    allowed: [immediate, on_restart]
    unconfirmed: true

battery:
  cell_address_layout:
    value: single_device
    allowed: [single_device, multi_device]
    unconfirmed: true

# Task 7 item 3: the control API's own listen address. Not a
# manufacturer-unconfirmed value like everything above — no such API
# exists in the real M261 at all, so there's nothing on-site testing
# could confirm it against — just an ordinary application setting.
# Loopback-only by default (AGENT-TASK §1.3). -control-addr (m261sim
# flag) overrides this without editing the file.
control_api:
  bind: 127.0.0.1:8081
