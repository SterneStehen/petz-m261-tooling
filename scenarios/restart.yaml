# AGENT-TASK.md, Task 7 item 6: "restart". Restart is not itself an
# action this scenario DSL can express (only write/fault/expect/link
# exist — item 4) and Task 7's control API has no process-restart
# endpoint (POST /reset returns simulator-internal state to its startup
# values, it does not touch the process, item 7). This scenario instead
# demonstrates what a monitoring system actually checks right after a
# real restart to confirm the simulator came back up correctly: EMS
# stays online and the heartbeat keeps advancing across an idle period.
name: restart
clock: {start: "2026-08-12T00:00:00+03:00", speed: 1}
steps:
  - at: 0s
    expect: {device: EMS, point: online_status, value: 1}
  - at: 5m
    expect: {device: EMS, point: online_status, value: 1}
  - at: 5m1s
    expect: {device: EMS, point: ems_periodic_heartbeat_indicator, min: 1}
