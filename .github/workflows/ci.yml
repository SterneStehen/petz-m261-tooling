name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml call this workflow as its test gate (`uses: ./.github/
  # workflows/ci.yml`) instead of duplicating the same steps there. No
  # `secrets:`/`inputs:` schema is declared because none of the jobs below
  # need one.
  workflow_call:

# Least-privilege default for every job in this file: nothing here pushes
# packages, writes PR comments, or calls any GitHub API beyond checking out
# the repo. A job that ever needs more should declare it explicitly on
# itself, not widen this.
permissions:
  contents: read

# A new push to the same branch/PR supersedes the previous run's result
# before it can even finish — cancel the stale one instead of burning
# runner minutes on an answer nobody will read. Scoped to the workflow +
# ref so concurrent branches/PRs don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    name: Web UI build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - working-directory: webui
        run: npm ci
      - working-directory: webui
        run: npm run build
      - working-directory: webui
        run: npx playwright install --with-deps chromium
      - working-directory: webui
        run: npm run e2e

  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum
      # gen/go/m261points (the generated catalog code the simulator
      # imports) is committed, like any other Go source — this whole job
      # never touches catalog/ or the private manufacturer register maps.
      # Scoped to tracked *.go files (git ls-files), not a bare "gofmt -l
      # ." over the whole checkout — see the Makefile's own `lint` target
      # for why (checks exactly what's actually committed, nothing else).
      - name: gofmt
        run: |
          files="$(git ls-files '*.go')"
          out="$(gofmt -l $files)"
          if [ -n "$out" ]; then
            echo "the following files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race

  python:
    name: Python tests (catalog/codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: catalog/requirements.txt
      - run: pip install -r catalog/requirements.txt
      # The manufacturer register maps (m261-registermap/) and the catalog
      # built from them (catalog/point_catalog.json) are private, local-
      # only material this repository does not include (see
      # docs/README.md and .gitignore) — a plain checkout has neither.
      # Most of this suite needs one or the other and skips itself
      # cleanly when they're absent (tests/conftest.py) rather than
      # failing; everything that doesn't (catalog.join/normalize/parsing
      # against synthetic fixtures) always runs.
      - run: python -m pytest tests/ -q -rs

  # mypy is deliberately its own job, not a step swallowed by "|| true"
  # inside `python` above: `|| true` throws away the real exit code, so a
  # totally broken mypy invocation (bad config, crashed import) would look
  # identical to a clean pass. continue-on-error here keeps this job's own
  # reported status honest — it still shows failed (with full output) when
  # mypy finds something — while never blocking the workflow or any
  # branch-protection check that depends on it, which is the explicit,
  # visible way to mark a check informational rather than hiding it.
  #
  # Why it's non-blocking at all: catalog/ has a small number of
  # pre-existing findings (missing type stubs for openpyxl/PyYAML, one
  # real pre-existing issue in normalize.py) outside this CI/CD change's
  # own scope to fix — see the Makefile's `lint` target for the same
  # rationale. Fixing those and promoting this to a required check is a
  # follow-up, not part of this change.
  mypy:
    name: mypy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: catalog/requirements.txt
      - run: pip install -r catalog/requirements.txt
      - run: python -m mypy catalog codegen

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker build -t m261sim:ci .

  # Task 3's own acceptance criterion, automated ("make generate
  # regenerates everything from scratch, git diff is empty" — see the
  # Makefile's own `validate` target). This job is intentionally gated
  # off by default: the private manufacturer register maps this needs are
  # not, and never will be, checked into this repository (see
  # docs/README.md) — there is no source for this job to fetch them from
  # here. A maintainer whose own CI environment *does* have access (a
  # self-hosted runner with the files already present, or a private,
  # access-controlled fetch step of their own) can enable it by setting
  # the repository variable HAS_REGISTERMAP to "true" and adding whatever
  # step actually provisions m261-registermap/ before `make validate`
  # runs — nothing here pretends that source already exists.
  generate-no-diff:
    name: make generate (no diff)
    runs-on: ubuntu-latest
    if: ${{ vars.HAS_REGISTERMAP == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: catalog/requirements.txt
      - run: pip install -r catalog/requirements.txt
      # A maintainer enabling this job (see above) is expected to insert
      # their own step here to populate m261-registermap/ before this
      # line runs.
      - run: make validate
