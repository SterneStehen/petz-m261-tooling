name: Deploy

# Manual only, by design: this rolls a specific, already-published image to
# the one current GitHub Environment (`dev`) on the self-hosted runner that
# lives on the Docker Compose host itself. The workflow refuses malformed,
# mutable, unpublished, or unattested tags before touching /opt/m261sim.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Immutable image tag to deploy: sha-<40 lowercase hex> from a main
          push, or a stable release tag X.Y.Z from a vX.Y.Z release.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-dev

jobs:
  deploy:
    name: Deploy (dev)
    runs-on: [self-hosted, linux, m261-dev]
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ -z "$IMAGE_TAG" ]]; then
            echo "::error::image_tag is required"
            exit 1
          fi
          if [[ "$IMAGE_TAG" == "latest" ]]; then
            echo "::error::latest is mutable and cannot be deployed"
            exit 1
          fi
          if [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            exit 0
          fi
          if [[ "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          echo "::error::image_tag must be sha-<40 lowercase hex> or a stable semver release X.Y.Z"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum

      # GHCR requires a lowercase image path; github.repository preserves
      # the repository's actual casing, so it can't be used directly
      # (matches release.yml's own image-name computation).
      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Verify image exists
        id: image-manifest
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image_digest="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::GHCR returned an invalid OCI digest for $IMAGE_REF: $image_digest"
            exit 1
          fi
          echo "ref=${{ steps.image.outputs.name }}@$image_digest" >> "$GITHUB_OUTPUT"

      # The self-hosted host's system GitHub CLI can be older than the
      # attestation command. Download a fixed release into RUNNER_TEMP and
      # verify the archive before using it; nothing is installed on the host.
      - name: Install verified GitHub CLI for provenance verification
        id: gh
        env:
          GH_VERSION: 2.93.0
          GH_ARCHIVE_SHA256: 02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64.tar.gz"
          tool_dir="$RUNNER_TEMP/gh-${GH_VERSION}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GH_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$tool_dir"
          tar -xzf "$archive" --strip-components=1 -C "$tool_dir"
          "$tool_dir/bin/gh" attestation verify --help >/dev/null
          echo "path=$tool_dir/bin/gh" >> "$GITHUB_OUTPUT"

      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PATH: ${{ steps.gh.outputs.path }}
          IMAGE_REF: ${{ steps.image-manifest.outputs.ref }}
        run: |
          set -euo pipefail
          "$GH_PATH" attestation verify "oci://$IMAGE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Deploy locally on the self-hosted host
        env:
          IMAGE_REF: ${{ steps.image-manifest.outputs.ref }}
          DEPLOY_DIR: /opt/m261sim
          STATE_FILE: /opt/m261sim/.deploy-state
        run: |
          set -euo pipefail

          set_image() {
            local image_ref="$1"
            if [ -f .env ] && grep -q '^M261SIM_IMAGE=' .env; then
              sed -i "s#^M261SIM_IMAGE=.*#M261SIM_IMAGE=$image_ref#" .env
            else
              printf 'M261SIM_IMAGE=%s\n' "$image_ref" >> .env
            fi
          }

          deploy_and_probe() {
            set_image "$1"
            docker compose pull || return
            docker compose up -d --remove-orphans || return
            go -C "$GITHUB_WORKSPACE" run ./simulator/cmd/deploy-probe -compose-dir "$DEPLOY_DIR" || return
          }

          resolve_to_digest_ref() {
            local image_ref="$1"
            if [[ "$image_ref" =~ ^.+@sha256:[0-9a-f]{64}$ ]]; then
              printf '%s\n' "$image_ref"
              return
            fi
            local image_name="${image_ref%:*}"
            local image_digest
            image_digest="$(docker buildx imagetools inspect "$image_ref" --format '{{.Manifest.Digest}}')" || return
            if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "invalid OCI digest for previous image $image_ref: $image_digest" >&2
              return 1
            fi
            printf '%s@%s\n' "$image_name" "$image_digest"
          }

          cd "$GITHUB_WORKSPACE"
          previous_ref="$(cat "$STATE_FILE" 2>/dev/null || true)"

          pushd "$DEPLOY_DIR" >/dev/null
          # Existing hosts may predate .deploy-state. Preserve the image that
          # was active in .env so a first workflow-run can still roll back.
          if [ -z "$previous_ref" ] && [ -f .env ]; then
            previous_ref="$(sed -n 's/^M261SIM_IMAGE=//p' .env | head -n 1)"
          fi
          if [ -n "$previous_ref" ]; then
            previous_ref="$(resolve_to_digest_ref "$previous_ref")" || {
              echo "::error::cannot resolve previous deployment image to an OCI digest" >&2
              popd >/dev/null
              exit 1
            }
          fi

          set +e
          deploy_and_probe "$IMAGE_REF"
          deploy_status=$?
          set -e
          if [ "$deploy_status" -eq 0 ]; then
            printf '%s\n' "$IMAGE_REF" > "$STATE_FILE"
            popd >/dev/null
            exit 0
          fi

          echo "::error::deployment verification failed for $IMAGE_REF" >&2

          if [ -n "$previous_ref" ] && [ "$previous_ref" != "$IMAGE_REF" ]; then
            echo "restoring previous known-good image $previous_ref" >&2
            set +e
            deploy_and_probe "$previous_ref"
            rollback_status=$?
            set -e
            if [ "$rollback_status" -eq 0 ]; then
              printf '%s\n' "$previous_ref" > "$STATE_FILE"
              echo "::error::rollback to $previous_ref succeeded, but this workflow still fails to surface the bad deploy" >&2
            else
              echo "::error::rollback verification failed for $previous_ref" >&2
            fi
          else
            echo "::error::no previous known-good image recorded in $STATE_FILE" >&2
          fi
          popd >/dev/null
          exit 1
