name: Release

# main pushes publish a CI-vetted immutable commit image for deploy.yml to
# consume; `v*` tags are the release path that adds semver tags and, for
# stable releases only, `latest`. workflow_dispatch is the explicit rebuild
# path for an immutable tag from an immutable source ref.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable source ref to build (40-char commit SHA or refs/tags/vX.Y.Z)
        type: string
        required: true
      image_tag:
        description: Explicit immutable image tag to publish (sha-<40 hex> or full semver)
        type: string
        required: true

# No blanket top-level grant beyond the read every job needs for checkout;
# the elevated permissions publishing actually requires (packages,
# attestations, OIDC token) are declared only on the one job that uses
# them, below.
permissions:
  contents: read

# Never cancel a publish that's already in flight — a half-pushed image
# under a reused tag is worse than a slightly delayed second run. Same-ref
# triggers still queue behind each other via the group.
concurrency:
  group: release-${{ github.ref }}

jobs:
  # Reuses ci.yml's own jobs (gofmt/vet/build/test, pytest, webui build +
  # Playwright e2e, docker build) as the test gate instead of duplicating
  # them here — see ci.yml's `workflow_call:` trigger. A release only
  # publishes once every one of those passes.
  test:
    name: Test gate
    uses: ./.github/workflows/ci.yml
    with:
      # On manual dispatch, test exactly the immutable ref that will be
      # checked out and published below.
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      attestations: write # publish the provenance attestation
      id-token: write # OIDC token the attestation is signed with
    steps:
      - name: Validate manual publish inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ && ! "$SOURCE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::source_ref must be a 40-character commit SHA or refs/tags/vX.Y.Z[-prerelease]"
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ && ! "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::image_tag must be sha-<40 lowercase hex> or a full semver tag like 1.2.3 or 1.2.3-rc1"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      # GHCR requires a lowercase image path; github.repository preserves
      # the repository's actual casing (SterneStehen/petz-m261-tooling),
      # so it can't be used for the image ref directly.
      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select publish tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "tags<<EOF"
              echo "type=raw,value=$IMAGE_TAG"
              echo "EOF"
              echo "flavor=latest=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "main" ]]; then
            {
              echo "tags<<EOF"
              echo "type=sha,format=long,prefix=sha-"
              echo "EOF"
              echo "flavor=latest=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "tags<<EOF"
            echo "type=semver,pattern={{version}}"
            echo "type=semver,pattern={{major}}.{{minor}}"
            echo "type=sha,format=long,prefix=sha-"
            echo "EOF"
            echo "flavor<<EOF"
            echo "latest=auto"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          # main pushes publish only the immutable commit tag. `v*` tag
          # pushes add semver tags and latest=auto. workflow_dispatch
          # publishes only the explicit immutable tag the caller provided,
          # even if source_ref points at a stable release tag.
          tags: ${{ steps.tags.outputs.tags }}
          flavor: ${{ steps.tags.outputs.flavor }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-build
          cache-to: type=gha,mode=max,scope=release-build

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
