name: Dependency review

# PR-only by design: this action diffs the dependency graph between a
# pull request's base and head commit, which only exists for a PR event —
# there is nothing to diff on a plain push.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Fail the check on moderate severity and above; low-severity
          # advisories are reported but don't block the PR.
          fail-on-severity: moderate
