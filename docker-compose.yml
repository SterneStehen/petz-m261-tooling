services:
  m261sim:
    # Both `image:` and `build:` are deliberate: local development runs
    # `docker compose build`/`up --build`, which builds from ./Dockerfile
    # and tags the result as `image:` below (M261SIM_IMAGE unset ->
    # m261sim:local). Production instead sets M261SIM_IMAGE (in .env; see
    # .env.example) to a published `ghcr.io/.../petz-m261-tooling:<tag>`
    # and runs `docker compose pull && docker compose up -d` — Compose
    # only falls back to building when the named image isn't already
    # present locally, so a plain `up -d` after a successful `pull` uses
    # the published image as-is, never rebuilds it. See deploy.yml and
    # README.md's CI/CD section.
    image: ${M261SIM_IMAGE:-m261sim:local}
    build: .
    restart: unless-stopped
    ports:
      # Publication-review fix: these two were bare "502:502"/"2404:2404"
      # — bound every host interface, not just loopback, unlike the
      # control-API port right below (which was already fixed for exactly
      # this reason). For a host that's ever reachable beyond a NAT
      # router with no port-forward to these ports (a public VPS, for
      # instance), that published Modbus/IEC-104 on every interface. The
      # whole point of the Cloudflare Tunnel deployment (docs, "Задача
      # 10" publication notes) is that inbound ports never need to be
      # opened at all — Modbus/IEC-104 must never be reachable outside
      # the host regardless of router/firewall configuration elsewhere.
      - "127.0.0.1:502:502"
      - "127.0.0.1:2404:2404"
      # Reviewed BLOCKER: the container listens on 0.0.0.0:8081 (see the
      # -control-addr override below — needed so the host can reach it at
      # all, since Docker's port forwarding doesn't arrive as a literal
      # loopback connection). Publishing that as a bare "8081:8081" binds
      # the *host* side to every host interface too, not just loopback —
      # any machine on the same network as the host could then call
      # /reset, /faults, /link, and scenario control. Binding the
      # published side explicitly to 127.0.0.1 keeps it reachable from the
      # host (this repository's own client examples, docs/README.md) while
      # everyone else on the network gets nothing to connect to.
      - "127.0.0.1:8081:8081"
    # The control API's own default bind (127.0.0.1:8081, loopback-only —
    # see docs/README.md) would be unreachable from the host even with the
    # port mapping above, since it's inside the container's own network
    # namespace: Docker's port forwarding doesn't arrive as a literal
    # loopback connection. -control-addr overrides just the *container's*
    # bind address, the documented escape hatch for exactly this
    # (AGENT-TASK §1.3: no hardcoded non-127.0.0.1 addresses in the
    # *code* — this is a runtime flag, not a code change) — the host-side
    # publish above is what actually keeps this loopback-only end to end,
    # for all three ports now, not just the control API.
    command:
      - -config=simulator/config/m261sim.yaml
      - -scenarios-dir=scenarios
      - -control-addr=0.0.0.0:8081
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2404"]
      interval: 5s
      timeout: 3s
      retries: 5
